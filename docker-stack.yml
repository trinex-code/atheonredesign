services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=contact@atheonworks.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
  app:
    image: ghcr.io/nirmalpiyumantha-pro/atheonworks:${GITHUB_SHA:-latest}
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=clients@contact.atheonworks.com
      - TO_EMAIL=nirmalpiyumantha.pro@gmail.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.atheonworks.loadbalancer.server.port=3000"
      - "traefik.http.routers.atheonworks.rule=Host(`atheonworks.com`)"
      - "traefik.http.routers.atheonworks.entrypoints=websecure"
      - "traefik.http.routers.atheonworks.tls.certresolver=myresolver"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        order: start-first

volumes:
  letsencrypt:
